- calibration:
    3D_model: extendedZolof
    camera_name: cam3
    resolution: 2176, 2176
    calibration_image: ./calibration/Cam3.tif
    target_file: ./Calibration/target_file

- analyze_calibration_error:
    camera_names: cam1, cam2, cam3, cam4
    plot_histogram: True

- calculate_BG_image:
    images_folder: Data/20260315_frames/Rec15/Cam1
    image_extension: '.tif'
    raw_format: False
    N_img: 200
    save_name: BG_cam3.tif

- calculate_equilization_map:
    images_folder: Images_cam3
    image_extension: '.tif'
    raw_format: False
    BG_image: BG_cam3.tif
    N_img: 200
    sigma: 100
    save_name: EQmap_cam3.tif

- segmentation:
    Number_of_images: 1
    image_start: 0
    images_folder: /Users/user/Desktop/Research/Data/20260315_frames/Rec15/clean_1
    single_image_name: 100.tif
    image_extension: '.tif'
    raw_format: False
    multiprocessing: True
    shape: particles
    mask: 1.0
    ROI: 0, 2020, 10, 2172
    plot_result: True
    threshold: 70
    remove_background: /Users/user/Desktop/Research/Data/20260315_frames/BG-EQ/Cam1-BG.tif
    equilization_map: None
    DoG_sigmas: None
    median: 1
    blur_sigma: 1
    local_filter: None
    min_xsize: 1.0
    min_ysize: 1.0
    min_mass: 300.0
    max_xsize: 1500.0
    max_ysize: 1500.0
    max_mass: 3000000
    method: labeling
    particle_size: 8  
    save_name: None

- matching:
    blob_files: blobs_cam1, blobs_cam2, blobs_cam3
    frame_start: 0
    N_frames: None
    march_forwards: True
    march_backwards: True
    camera_names: cam1, cam2, cam3
    ROI: 0.0, 70.0, 0.0, 70.0, -25.0, 15.0
    voxel_size: 20
    N0: 100
    max_err: 0.25
    min_cam_match: 3
    save_name: particles

- analyze_disparity:
    blob_files: blobs_cam1, blobs_cam2, blobs_cam3
    particle_filename: particles
    camera_names: cam1, cam2, cam3
    max_err: 0.25
    min_cam_match: 3

- tracking:
    particles_file_name: particles
    method: multiframe
    frame_start: 0
    N_frames: None
    d_max: 1.0
    dv_max: 1.0
    max_dt: 3
    Ns: 5
    NSR_threshold: 0.25
    mean_flow: [0.0, 0.0, 0.0]
    plot_candidate_graph: False
    save_name: trajectories

- calibration_with_particles:
    camera_name: cam1
    traj_filename: './trajectories'
    cam_number: 1 
    blobs_fname: 'blobs_cam1'
    min_traj_len: 4
    max_point_number: 1000

- smoothing:
    trajectory_file: trajectories
    window_size: 3
    polynom_order: 2
    min_traj_length: 4
    repetitions: 1
    save_name: smoothed_trajectories

- stitching:
    trajectory_file: smoothed_trajectories
    max_time_separation: 4
    max_distance: 0.4
    save_name: trajecotries_stitched

- 2D_tracking:
    blob_file: blobs_cam1
    frame_start: 0
    N_frames: None
    camera_name: cam1
    camera_resolution: 1280, 1024
    z_particles: 0.0
    d_max: 1.0
    dv_max: 1.0
    save_name: trajectories_2D

- manual_matching_GUI:
    cameras: [cam1, cam2, cam3]
    images: [./Images_cam1/01.tif, ./Images_cam2/01.tif, ./Images_cam3/01.tif]

- fiber_orientations:
    camera_names: cam1, cam2, cam3
    method: MinProjection
    ori_lim: 0.005
    blob_files: blobs_cam1_directions, blobs_cam2_directions, blobs_cam3_directions
    trajectory_file: trajectories
    save_name: fiber_orientations

- plot_trajectories:
    file_name: smoothed_trajectories
    min_length: 2
    write_trajID: False 
    t0: 0
    te: -1

- animate_trajectories:
    file_name: smoothed_trajectories
    min_length: 2 
    f_start: None
    f_end: None
    fps: 25
    tail_length: 3
    elevation: 15
    azimoth: 70
    rotation_rate: 0.2

- run_extension:
    path_to_extention: the_absolute_path_to_the_script_containing_the_code 
    action_name: the_name_of_the_class_that_needs_to_run  
    extention_params_file: the_path_to_the_extentions_params_file

